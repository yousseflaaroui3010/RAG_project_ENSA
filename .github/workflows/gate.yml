name: gate
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PACKAGE MANAGER: uv (astral-sh). Lockfile authority is uv.lock (ADR-10).
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Lint / typecheck gate
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Commit message format
        run: |
          git log origin/main..HEAD --format=%B | grep -q "INTENT:" || \
            (echo "Missing INTENT: line in commit body" && exit 1)
      - name: Duplication gate (fails over 3%)
        run: npx jscpd . --gitignore --threshold 3 --exitCode 1
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
