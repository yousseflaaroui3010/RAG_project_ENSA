locked_decisions:
  - {adr_id: ADR-01, ruling_1_line: "One Python process, six modules", downstream_consequence: "Epics map 1:1 to modules; no service orchestration work"}
  - {adr_id: ADR-02, ruling_1_line: "UI on Gradio Blocks, three tabs = PRD screens", downstream_consequence: "No JS toolchain; UI stories are Python stories"}
  - {adr_id: ADR-03, ruling_1_line: "Agent = LangGraph graph (clarify, retrieve, grade, retry, answer, refuse)", downstream_consequence: "F-04 retry ceiling and F-05 refusal are testable nodes"}
  - {adr_id: ADR-04, ruling_1_line: "Qdrant embedded, one collection per workspace", downstream_consequence: "F-01 isolation is structural; no DB server story"}
  - {adr_id: ADR-05, ruling_1_line: "Dense multilingual-e5-base local + BM25 sparse, hybrid; prefixes mandatory", downstream_consequence: "Prefix unit test required; BGE-M3 is the recorded upgrade path"}
  - {adr_id: ADR-06, ruling_1_line: "Provider-agnostic model, cloud-key mode + strict-local mode (7B+ floor)", downstream_consequence: "Offline rehearsal story; OR-2 checklist before defense"}
  - {adr_id: ADR-07, ruling_1_line: "pymupdf4llm for PDF, markitdown for DOCX/PPTX, scanned PDFs skipped-with-reason", downstream_consequence: "Conversion ladder fixed; OCR stays V2"}
  - {adr_id: ADR-08, ruling_1_line: "SQLite runtime, JSON parent store, PostgreSQL reference DDL", downstream_consequence: "schema.sql from section 7.4; PRAGMA foreign_keys enforced in code"}
  - {adr_id: ADR-09, ruling_1_line: "In-process trace collector, no external observability", downstream_consequence: "F-10 reads local traces; zero third-party setup"}
  - {adr_id: ADR-10, ruling_1_line: "uv + lockfile; Docker image for demo and fallback", downstream_consequence: "Lockfile is the exact-version authority; R4 mitigation rehearsed via compose"}
  - {adr_id: ADR-11, ruling_1_line: "Trunk-based git, protected main, squash merges, partner review, Conventional Commits", downstream_consequence: "Sprint-0 setup stories; PR template from section 12.2"}
  - {adr_id: ADR-12, ruling_1_line: "CI = lint + mocked tests + Docker build; evaluation is manual-dispatch, cost-gated", downstream_consequence: "ci.yml and eval.yml stories; eval dispatch is a human click"}
