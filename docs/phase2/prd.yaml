locked_decisions:
  - {id: LD-01, ruling_1_line: "On-demand Sync in V1, no background folder watcher", downstream_consequence: "Architecture designs a manual sync pipeline; watcher is a V2 epic"}
  - {id: LD-02, ruling_1_line: "Flagship workspace = Moroccan HR/labor law (French corpus); workspace 2 = technical manuals", downstream_consequence: "QA golden set (40 + 20 out-of-scope) built on the labor corpus; French text handling required in V1"}
  - {id: LD-03, ruling_1_line: "V1 formats: PDF, DOCX, TXT, MD; PPTX in V1.1; scanned PDFs skipped-with-reason until V2", downstream_consequence: "Ingestion scope fixed; the skip behavior is binding"}
  - {id: LD-04, ruling_1_line: "Releases gate on evaluation: groundedness >=90%, refusals 20/20, sources 100%", downstream_consequence: "QA stands up the eval harness before V1.0 ships"}
  - {id: LD-05, ruling_1_line: "UI copy English in V1; RTL-ready layouts verified; Arabic corpus deferred to V2", downstream_consequence: "No Arabic ingestion work in V1; RTL preview in QA"}
  - {id: LD-06, ruling_1_line: "Documents and derived data stay on operator-controlled storage; external processing must not retain content", downstream_consequence: "Constrains every external service choice; architecture reports back how it complies"}
  - {id: LD-07, ruling_1_line: "Single-user V1; Operator/End-user roles defined but unenforced", downstream_consequence: "No auth work in V1; design must not block V2 accounts"}
  - {id: LD-08, ruling_1_line: "Five-level priorities; scope moves down, never up, without a signed PRD change", downstream_consequence: "Project plan derives sprints from Highest and High first"}
