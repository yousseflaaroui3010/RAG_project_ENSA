# A Keycloak for developing and demonstrating S6 login. DEV ONLY.
#
#   docker compose -f compose.keycloak.yaml up -d
#
# `start-dev` keeps everything in memory: the realm, the users and the
# client are gone when the container stops. That is deliberate for a demo
# machine, and it is why no realm file lives in this repository -- a realm
# export carries the client secret, and the core law forbids a secret in a
# committed file. docs/design/S6-auth-rbac.md and README.md say which five
# things to create in the admin console; it takes about three minutes.
#
# NOTHING HERE IS A PRODUCTION SETUP: no TLS, no database, no backups,
# admin credentials from the shell environment. Keycloak's own
# documentation says the same about `start-dev`.

services:
  keycloak:
    # Pinned, not `latest`: a demo that changes under the demo is not a demo.
    image: quay.io/keycloak/keycloak:26.4
    container_name: sanad-keycloak
    command: ["start-dev", "--http-port=8080"]
    environment:
      # Keycloak 26's names (the older KEYCLOAK_ADMIN pair is gone).
      # Required, with no default: a login server whose administrator
      # password came from a compose file is not a login server.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      # 127.0.0.1 only, like Sanad itself (LD-07).
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo ok >&3"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
